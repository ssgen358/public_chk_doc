# ============================================================
# フォーマットテンプレート定義ファイル（サンプル）
# check_format.py で使用する
# ============================================================
#
# 【構造】
# sheets:
#   - name     : シート名（必須）
#     required : シートの存在が必須かどうか（true/false、省略時: true）
#     headers  : ヘッダー行の定義（省略可）
#       row    : ヘッダーが記載されている行番号（1始まり）
#       columns: 期待する列名のリスト（順序は問わない）
#     cells    : 特定セルの存在チェック定義（省略可）
#       - address : セルアドレス（例: A1）
#         label   : チェック結果に表示する名称（省略時: addressをそのまま使用）
#         required: 値の存在が必須かどうか（true/false、省略時: true）
#                   false の場合、値がなければ結果は WARN（NGではない）
# ============================================================

sheets:

  # ── 基本情報シート ──────────────────────────────────────────────
  - name: "基本情報"
    required: true
    cells:
      - address: "B2"
        label: "ドキュメント名"
        required: true
      - address: "B3"
        label: "作成者"
        required: true
      - address: "B4"
        label: "作成日"
        required: true
      - address: "B5"
        label: "バージョン"
        required: false   # 任意項目（空欄でも WARN どまり）

  # ── 改訂履歴シート ──────────────────────────────────────────────
  - name: "改訂履歴"
    required: true
    headers:
      row: 1
      columns:
        - "版数"
        - "改訂日"
        - "改訂内容"
        - "改訂者"

  # ── 設計内容シート ──────────────────────────────────────────────
  - name: "設計内容"
    required: true
    headers:
      row: 1
      columns:
        - "No"
        - "項目名"
        - "説明"
        - "備考"

  # ── 補足資料シート（任意）───────────────────────────────────────
  - name: "補足資料"
    required: false       # 存在しなくても WARN どまり
